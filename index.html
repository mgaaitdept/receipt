<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="blob b4"></div>
<main>
  <header class="card hero">
  <h1>🧾 Receipt Scanner ✨</h1>
  <p class="sub">Photo → crop to the receipt → straighten → clean up → save. Everything runs on your device.</p>
  </header>

  <div class="card">
    <div class="row">
      <label class="btn primary">📸 Take photo

      </label>
      <label class="btn">🖼️ Choose image

      <button id="liveBtn">🎥 Live camera</button>
    </div>
    <div id="liveBox" class="hide" style="margin-top:12px">

      <div class="row" style="margin-top:8px">

        <button id="stopBtn">Cancel</button>

    </div>
  </div>

  <div id="editCard" class="card hide">
    <div class="row" style="justify-content:space-between; margin-bottom:8px">
      <strong>🌸 1. Adjust the corners</strong>

  </div>

  <div id="outCard" class="card hide">

      <div class="row">
        <select id="mode">
          <option value="clean" selected>Clean (white paper, color)</option>
          <option value="bw">Black &amp; white</option>
          <option value="gray">Grayscale</option>

    <div class="row" style="margin-top:12px">
      <button id="saveJpg" class="primary">💾 Save JPG</button>
      <button id="savePng">💎 Save PNG</button>
      <button id="savePdf">📄 Save PDF</button>
    </div>
    <p id="status" class="hint"></p>
  </div>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);
const view = $('view'), vctx = view.getContext('2d');
const result = $('result'), rctx = result.getContext('2d');
let srcCanvas = null;          // full-res source
let corners = [];              // TL,TR,BR,BL in source coords
let scale = 1, dragIdx = -1;
let warped = null;             // ImageData of cropped, un-enhanced receipt

/* ---------- Loading images ---------- */
function loadFile(file) {
  if (!file) return;
  const img = new Image();
  img.onload = () => { setSource(img); URL.revokeObjectURL(img.src); };
  img.onerror = () => alert('Could not open that image.');

}
$('camInput').onchange = e => { loadFile(e.target.files[0]); e.target.value = ''; };
$('fileInput').onchange = e => { loadFile(e.target.files[0]); e.target.value = ''; };

function setSource(imgEl) {
  const w = imgEl.naturalWidth || imgEl.videoWidth || imgEl.width;
  const h = imgEl.naturalHeight || imgEl.videoHeight || imgEl.height;
  const k = Math.min(1, 2800 / Math.max(w, h));
  srcCanvas = document.createElement('canvas');
  srcCanvas.width = Math.round(w * k); srcCanvas.height = Math.round(h * k);
  srcCanvas.getContext('2d').drawImage(imgEl, 0, 0, srcCanvas.width, srcCanvas.height);
  $('editCard').classList.remove('hide');
  $('outCard').classList.add('hide');
  corners = detectCorners(srcCanvas);
  drawView();
  $('editCard').scrollIntoView({ behavior: 'smooth' });
}

/* ---------- Live camera ---------- */
let stream = null;
$('liveBtn').onclick = async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    $('video').srcObject = stream; await $('video').play();
    $('liveBox').classList.remove('hide');
  } catch (e) {
    alert('Live camera is not available here (' + e.name + '). Use "Take photo" instead.');
  }
};
function stopLive() { if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; $('liveBox').classList.add('hide'); }
$('stopBtn').onclick = stopLive;
$('snapBtn').onclick = () => { setSource($('video')); stopLive(); };

/* ---------- Corner detection ---------- */
function detectCorners(canvas) {
  const W = canvas.width, H = canvas.height;
  const k = Math.min(1, 480 / Math.max(W, H));

  for (let i = 0; i < g.length; i++) hist[Math.min(255, g[i] | 0)]++;
  let sum = 0; for (let i = 0; i < 256; i++) sum += i * hist[i];
  let wB = 0, sB = 0, best = 0, thr = 128;
  for (let i = 0; i < 256; i++) {
    wB += hist[i]; if (!wB) continue;
    const wF = g.length - wB; if (!wF) break;

    const mB = sB / wB, mF = (sum - sB) / wF, v = wB * wF * (mB - mF) * (mB - mF);
    if (v > best) { best = v; thr = i; }
  }
  const fallback = () => { const m = 0.06; return [[W*m,H*m],[W*(1-m),H*m],[W*(1-m),H*(1-m)],[W*m,H*(1-m)]]; };

  let pick = null;
  for (const bright of [true, false]) {
    const mask = new Uint8Array(w * h);
    for (let i = 0; i < g.length; i++) mask[i] = (bright ? g[i] > thr : g[i] <= thr) ? 1 : 0;
    const comp = largestComponent(mask, w, h);
    if (!comp) continue;
    const frac = comp.count / (w * h);
    const touches = comp.touchesBorder;
    const score = (frac > 0.12 && frac < 0.97 ? 1 : 0) + (touches < 3 ? 1 : 0) + (bright ? 0.1 : 0);
    if (!pick || score > pick.score) pick = { score, comp, frac };
  }
  if (!pick || pick.frac < 0.1 || pick.frac > 0.97) return fallback();
  const pts = pick.comp.pts;
  let tl, tr, br, bl, a = 1e9, b = -1e9, c = -1e9, e = 1e9;
  for (let i = 0; i < pts.length; i += 2) {
    const x = pts[i], y = pts[i+1], s = x + y, df = x - y;
    if (s < a) { a = s; tl = [x, y]; }
    if (s > b) { b = s; br = [x, y]; }
    if (df > c) { c = df; tr = [x, y]; }
    if (df < e) { e = df; bl = [x, y]; }

  return [tl, tr, br, bl].map(p => [Math.min(W, Math.max(0, (p[0] + 0.5) / k)), Math.min(H, Math.max(0, (p[1] + 0.5) / k))]);
}
function boxBlur(src, w, h, r) {
  const tmp = new Float32Array(w * h), out = new Float32Array(w * h);

    let s = 0, n = 0;
    for (let i = -r; i <= r; i++) { const xx = x + i; if (xx >= 0 && xx < w) { s += src[y*w+xx]; n++; } }

  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let s = 0, n = 0;
    for (let i = -r; i <= r; i++) { const yy = y + i; if (yy >= 0 && yy < h) { s += tmp[yy*w+x]; n++; } }
    out[y*w+x] = s / n;

}
function largestComponent(mask, w, h) {
  const seen = new Uint8Array(w * h), stack = new Int32Array(w * h);

    if (!mask[s] || seen[s]) continue;
    let sp = 0, count = 0, touches = 0; const pts = [];
    stack[sp++] = s; seen[s] = 1;
    const edge = { l: 0, r: 0, t: 0, b: 0 };
    while (sp) {
      const p = stack[--sp], x = p % w, y = (p / w) | 0;
      count++; pts.push(x, y);
      if (x === 0) edge.l = 1; if (x === w-1) edge.r = 1; if (y === 0) edge.t = 1; if (y === h-1) edge.b = 1;
      if (x > 0 && mask[p-1] && !seen[p-1]) { seen[p-1] = 1; stack[sp++] = p-1; }
      if (x < w-1 && mask[p+1] && !seen[p+1]) { seen[p+1] = 1; stack[sp++] = p+1; }
      if (y > 0 && mask[p-w] && !seen[p-w]) { seen[p-w] = 1; stack[sp++] = p-w; }
      if (y < h-1 && mask[p+w] && !seen[p+w]) { seen[p+w] = 1; stack[sp++] = p+w; }
    }
    touches = edge.l + edge.r + edge.t + edge.b;

/* ---------- Corner editor ---------- */
function drawView() {
  if (!srcCanvas) return;
  const cw = Math.min(srcCanvas.width, 1100);
  scale = cw / srcCanvas.width;
  view.width = cw; view.height = Math.round(srcCanvas.height * scale);
  vctx.drawImage(srcCanvas, 0, 0, view.width, view.height);
  const P = corners.map(p => [p[0] * scale, p[1] * scale]);
  // dim outside
  vctx.save();
  vctx.fillStyle = 'rgba(0,0,0,.45)';
  vctx.beginPath(); vctx.rect(0, 0, view.width, view.height);
  vctx.moveTo(P[0][0], P[0][1]); P.slice(1).forEach(p => vctx.lineTo(p[0], p[1])); vctx.closePath();
  vctx.fill('evenodd'); vctx.restore();
  vctx.lineWidth = Math.max(2, view.width / 400); vctx.strokeStyle = '#ff7eb6';
  vctx.beginPath(); vctx.moveTo(P[0][0], P[0][1]); P.slice(1).forEach(p => vctx.lineTo(p[0], p[1])); vctx.closePath(); vctx.stroke();
  const r = Math.max(9, view.width / 55);
  P.forEach(p => { vctx.beginPath(); vctx.arc(p[0], p[1], r, 0, 7); vctx.fillStyle = '#ff7eb6'; vctx.fill(); vctx.lineWidth = 3; vctx.strokeStyle = '#fff'; vctx.stroke(); });
}
function evPos(e) { const r = view.getBoundingClientRect(); return [(e.clientX - r.left) * view.width / r.width, (e.clientY - r.top) * view.height / r.height]; }
view.addEventListener('pointerdown', e => {
  const [x, y] = evPos(e); let bi = -1, bd = 1e9;
  corners.forEach((c, i) => { const d = Math.hypot(c[0]*scale - x, c[1]*scale - y); if (d < bd) { bd = d; bi = i; } });
  if (bd < view.width / 7) { dragIdx = bi; view.setPointerCapture(e.pointerId); }
});
view.addEventListener('pointermove', e => {
  if (dragIdx < 0) return;
  const [x, y] = evPos(e);
  corners[dragIdx] = [Math.min(srcCanvas.width, Math.max(0, x / scale)), Math.min(srcCanvas.height, Math.max(0, y / scale))];
  drawView();
});
const endDrag = () => { dragIdx = -1; };
view.addEventListener('pointerup', endDrag); view.addEventListener('pointercancel', endDrag);
$('autoBtn').onclick = () => { corners = detectCorners(srcCanvas); drawView(); };

/* ---------- Perspective warp ---------- */
function solveHomography(dst, src) {
  // maps dst (u,v) -> src (x,y); returns 8 coefficients
  const A = [], b = [];
  for (let i = 0; i < 4; i++) {
    const [u, v] = dst[i], [x, y] = src[i];
    A.push([u, v, 1, 0, 0, 0, -u*x, -v*x]); b.push(x);
    A.push([0, 0, 0, u, v, 1, -u*y, -v*y]); b.push(y);
  }
  const n = 8;
  for (let i = 0; i < n; i++) {
    let m = i; for (let r = i + 1; r < n; r++) if (Math.abs(A[r][i]) > Math.abs(A[m][i])) m = r;
    [A[i], A[m]] = [A[m], A[i]]; [b[i], b[m]] = [b[m], b[i]];
    for (let r = i + 1; r < n; r++) {
      const f = A[r][i] / A[i][i];
      for (let c = i; c < n; c++) A[r][c] -= f * A[i][c];
      b[r] -= f * b[i];
    }
  }
  const x = new Array(n).fill(0);
  for (let i = n - 1; i >= 0; i--) {
    let s = b[i]; for (let c = i + 1; c < n; c++) s -= A[i][c] * x[c];
    x[i] = s / A[i][i];
  }
  return x;
}
function warp() {
  const [tl, tr, br, bl] = corners;
  const dist = (a, b) => Math.hypot(a[0]-b[0], a[1]-b[1]);
  let W = Math.max(dist(tl, tr), dist(bl, br)), H = Math.max(dist(tl, bl), dist(tr, br));
  const k = Math.min(1, 2400 / Math.max(W, H)); W = Math.max(16, Math.round(W * k)); H = Math.max(16, Math.round(H * k));
  const hm = solveHomography([[0,0],[W,0],[W,H],[0,H]], corners);
  const sctx = srcCanvas.getContext('2d'), sw = srcCanvas.width, sh = srcCanvas.height;
  const sd = sctx.getImageData(0, 0, sw, sh).data;
  const out = new ImageData(W, H), od = out.data;
  for (let v = 0; v < H; v++) for (let u = 0; u < W; u++) {
    const den = hm[6]*u + hm[7]*v + 1;
    const x = (hm[0]*u + hm[1]*v + hm[2]) / den, y = (hm[3]*u + hm[4]*v + hm[5]) / den;
    const x0 = Math.max(0, Math.min(sw - 2, Math.floor(x))), y0 = Math.max(0, Math.min(sh - 2, Math.floor(y)));
    const fx = Math.min(1, Math.max(0, x - x0)), fy = Math.min(1, Math.max(0, y - y0));
    const i00 = (y0*sw + x0) * 4, i10 = i00 + 4, i01 = i00 + sw*4, i11 = i01 + 4, o = (v*W + u) * 4;
    for (let c = 0; c < 3; c++) {
      od[o+c] = sd[i00+c]*(1-fx)*(1-fy) + sd[i10+c]*fx*(1-fy) + sd[i01+c]*(1-fx)*fy + sd[i11+c]*fx*fy;
    }
    od[o+3] = 255;
  }
  return out;
}

/* ---------- Enhancement ---------- */
function enhance(img, mode) {
  const W = img.width, H = img.height, src = img.data;
  const out = new ImageData(new Uint8ClampedArray(src), W, H), d = out.data;
  if (mode === 'orig') return out;
  const lum = i => 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
  if (mode === 'gray') {
    for (let i = 0; i < d.length; i += 4) { const l = lum(i); d[i] = d[i+1] = d[i+2] = l; }
  }
  // estimate paper brightness (block max, smoothed) and divide it out to remove shadows
  const bs = Math.max(12, Math.round(Math.max(W, H) / 60));
  const gw = Math.ceil(W / bs), gh = Math.ceil(H / bs);
  let grid = new Float32Array(gw * gh);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const gi = ((y / bs) | 0) * gw + ((x / bs) | 0), l = lum((y*W + x) * 4);
    if (l > grid[gi]) grid[gi] = l;
  }
  grid = boxBlur(grid, gw, gh, 1); grid = boxBlur(grid, gw, gh, 1);
  const bgAt = (x, y) => {
    const gx = Math.min(gw - 1.001, Math.max(0, x / bs - 0.5)), gy = Math.min(gh - 1.001, Math.max(0, y / bs - 0.5));
    const x0 = gx | 0, y0 = gy | 0, fx = gx - x0, fy = gy - y0;
    return grid[y0*gw+x0]*(1-fx)*(1-fy) + grid[y0*gw+x0+1]*fx*(1-fy) + grid[(y0+1)*gw+x0]*(1-fx)*fy + grid[(y0+1)*gw+x0+1]*fx*fy;
  };
  // global low/high for contrast stretch (after normalization)
  const hist = new Uint32Array(256);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = (y*W + x) * 4, bg = Math.max(40, bgAt(x, y)), f = 255 / bg;
    d[i] = Math.min(255, d[i]*f); d[i+1] = Math.min(255, d[i+1]*f); d[i+2] = Math.min(255, d[i+2]*f);
    hist[lum(i) | 0]++;
  }

  for (let i = 0; i < 256; i++) { acc += hist[i]; if (acc > total * 0.01) { lo = i; break; } }
  const hi = 235;
  for (let i = 0; i < d.length; i += 4) {

      const l = lum(i), v = Math.max(0, Math.min(255, (l - (lo + 70)) / 40 * 255 + 0));

    } else {
      for (let c = 0; c < 3; c++) {
        let v = (d[i+c] - lo) / (hi - lo) * 255;
        d[i+c] = v < 0 ? 0 : v > 255 ? 255 : v;
      }
    }
  }
  return out;
}

/* ---------- Scan / render ---------- */
let rotation = 0;
function render() {
  if (!warped) return;
  let img = enhance(warped, $('mode').value);
  const t = document.createElement('canvas'); t.width = img.width; t.height = img.height;
  t.getContext('2d').putImageData(img, 0, 0);
  const r = rotation % 4, sw = r % 2 ? t.height : t.width, sh = r % 2 ? t.width : t.height;
  result.width = sw; result.height = sh;
  rctx.save(); rctx.translate(sw / 2, sh / 2); rctx.rotate(r * Math.PI / 2); rctx.drawImage(t, -t.width / 2, -t.height / 2); rctx.restore();
}
$('scanBtn').onclick = () => {
  $('scanBtn').disabled = true; $('scanBtn').textContent = 'Scanning… ✨';
  setTimeout(() => {
    try { warped = warp(); rotation = 0; render(); $('outCard').classList.remove('hide'); $('outCard').scrollIntoView({ behavior: 'smooth' }); }
    finally { $('scanBtn').disabled = false; $('scanBtn').textContent = '✨ Scan'; }
  }, 30);
};
$('mode').onchange = render;
$('rotBtn').onclick = () => { rotation++; render(); };

/* ---------- Saving ---------- */
const stamp = () => { const n = new Date(), p = x => String(x).padStart(2, '0'); return `receipt-${n.getFullYear()}${p(n.getMonth()+1)}${p(n.getDate())}-${p(n.getHours())}${p(n.getMinutes())}${p(n.getSeconds())}`; };
async function saveBlob(blob, name, mime, ext) {
  if (window.showSaveFilePicker) {
    try {
      const h = await window.showSaveFilePicker({ suggestedName: name, types: [{ description: ext.toUpperCase(), accept: { [mime]: ['.' + ext] } }] });
      const w = await h.createWritable(); await w.write(blob); await w.close();
      $('status').textContent = 'Saved ' + h.name; return;
    } catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  $('status').textContent = 'Downloaded ' + name + ' (check your Downloads folder).';
}
const toBlob = (type, q) => new Promise(res => result.toBlob(res, type, q));
$('saveJpg').onclick = async () => saveBlob(await toBlob('image/jpeg', 0.92), stamp() + '.jpg', 'image/jpeg', 'jpg');
$('savePng').onclick = async () => saveBlob(await toBlob('image/png'), stamp() + '.png', 'image/png', 'png');
$('savePdf').onclick = async () => {
  const jpg = new Uint8Array(await (await toBlob('image/jpeg', 0.92)).arrayBuffer());
  const w = result.width, h = result.height, pw = (w * 0.24).toFixed(2), ph = (h * 0.24).toFixed(2); // ~300 dpi
  const enc = new TextEncoder(), parts = [], offs = []; let len = 0;
  const push = b => { const u = typeof b === 'string' ? enc.encode(b) : b; parts.push(u); len += u.length; };
  push('%PDF-1.4\n');
  const obj = (n, body) => { offs[n] = len; push(`${n} 0 obj\n` + body + '\nendobj\n'); };
  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
  obj(3, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pw} ${ph}] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>`);
  const cs = `q ${pw} 0 0 ${ph} 0 0 cm /Im0 Do Q`;
  obj(4, `<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`);
  offs[5] = len; push(`5 0 obj\n<< /Type /XObject /Subtype /Image /Width ${w} /Height ${h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`);
  push(jpg); push('\nendstream\nendobj\n');
  const xref = len; let x = 'xref\n0 6\n0000000000 65535 f \n';
  for (let i = 1; i <= 5; i++) x += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
  push(x + `trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
  saveBlob(new Blob(parts, { type: 'application/pdf' }), stamp() + '.pdf', 'application/pdf', 'pdf');
};
</script>
